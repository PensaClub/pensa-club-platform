name: Manual Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      backup:
        description: 'Create backup before deploy'
        required: true
        default: 'true'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /root/Digital-Literacy-Wellbeing-60-plus
          
          docker exec digital-literacy-wellbeing-60-plus-db-1 pg_dump -U postgres pensaclub_db | gzip > /root/backups/pensaclub_db_before_deploy_$(date +%Y%m%d_%H%M%S).sql.gz
          echo "Backup created"
          
          git pull origin main     
          docker compose down
          docker compose up --build -d
          
          sleep 10
          docker compose ps
          echo "Deployment completed"
